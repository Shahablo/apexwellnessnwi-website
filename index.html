-size:14.5px;font-weight:500\">\n    <a href=\"#weight\" style=\"padding:7px 12px;border-radius:6px;color:#425466\" style-hover=\"background:#F6F9FC;color:#0B1F3A\">Weight &amp; Metabolic<\u002Fa>\n    <a href=\"#men\" style=\"padding:7px 12px;border-radius:6px;color:#425466\" style-hover=\"background:#F6F9FC;color:#0B1F3A\">Men's Hormone<\u002Fa>\n    <a href=\"#women\" style=\"padding:7px 12px;border-radius:6px;color:#425466\" style-hover=\"background:#F6F9FC;color:#0B1F3A\">Women's Midlife<\u002Fa>\n    <a href=\"#how\" style=\"padding:7px 12px;border-radius:6px;color:#425466\" style-hover=\"background:#F6F9FC;color:#0B1F3A\">How It Works<\u002Fa>\n    <a href=\"#pricing\" style=\"padding:7px 12px;border-radius:6px;color:#425466\" style-hover=\"background:#F6F9FC;color:#0B1F3A\">Pricing<\u002Fa>\n    <a href=\"#about\" style=\"padding:7px 12px;border-radius:6px;color:#425466\" style-hover=\"background:#F6F9FC;color:#0B1F3A\">About<\u002Fa>\n    <a href=\"#faq\" style=\"padding:7px 12px;border-radius:6px;color:#425466\" style-hover=\"background:#F6F9FC;color:#0B1F3A\">FAQ<\u002Fa>\n  <\u002Fnav>\n  <a href=\"#priority\" style=\"background:#0B1F3A;color:#fff;padding:9px 16px;border-radius:6px;font-weight:500;font-size:14px;display:flex;gap:8px;align-items:center\" style-hover=\"background:#2E8B82;color:#fff\">{{ ctaLabel }}<span style=\"font-weight:500\">→<\u002Fspan><\u002Fa>\n<\u002Fheader>\n\n<!-- ============ HOME ============ -->\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<main data-screen-label=\"Home\">\n<section style=\"position:relative;background:#0B1F3A;color:#fff;overflow:hidden\">\n  <div style=\"position:absolute;inset:0;background:radial-gradient(1200px 500px at 85% 0%,rgba(46,139,130,.35),transparent 60%),radial-gradient(800px 400px at 0% 100%,rgba(46,139,130,.18),transparent 60%);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(180deg,rgba(0,0,0,.7),transparent);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:64px;padding:104px 120px 128px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:24px\">\n      <span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7FD1C6\">Medical wellness · Northwest Indiana<\u002Fspan>\n      <h1 style=\"margin:0;font-weight:600;font-size:64px;line-height:1.02;letter-spacing:-.04em;text-wrap:pretty\">Weight and hormone care, managed by a physician.<\u002Fh1>\n      <p style=\"margin:0;font-size:19px;line-height:1.5;color:#B7C3D3;max-width:520px;text-wrap:pretty\">At Apex Wellness a physician reviews your evaluation, your labs, and your plan, and stays responsible for it afterward. Transparent options for adults across Northwest Indiana.<\u002Fp>\n      <div style=\"display:flex;gap:12px;padding-top:4px\">\n        <a href=\"#priority\" style=\"background:#fff;color:#0B1F3A;padding:12px 18px;border-radius:6px;font-weight:500;font-size:15px;display:flex;gap:8px;align-items:center\" style-hover=\"background:#7FD1C6;color:#0B1F3A\">{{ ctaLabel }}<span style=\"font-weight:500\">→<\u002Fspan><\u002Fa>\n        <a href=\"#how\" style=\"color:#fff;padding:12px 18px;border-radius:6px;font-weight:500;font-size:15px;border:1px solid rgba(255,255,255,.25)\" style-hover=\"border-color:#fff;color:#fff\">How it works<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;height:520px\">\n      <image-slot id=\"s-hero\" shape=\"rounded\" radius=\"10\" placeholder=\"Physician in consultation with a patient\"><\u002Fimage-slot>\n      <div style=\"position:absolute;left:24px;right:24px;bottom:24px;background:rgba(255,255,255,.96);color:#0B1F3A;border-radius:8px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px;pointer-events:none;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)\">\n        <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-weight:600;font-size:15px;letter-spacing:-.01em\">Every plan is reviewed by a physician.<\u002Fspan><span style=\"font-size:13.5px;color:#425466\">Evaluation, labs, dosing, and follow-up, all under physician management.<\u002Fspan><\u002Fdiv>\n        <span style=\"flex:none;width:36px;height:36px;border-radius:50%;background:#EAF5F3;display:flex;align-items:center;justify-content:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\" fill=\"none\"><path d=\"M3.5 9.5 7 13l7.5-8\" stroke=\"#2E8B82\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:0 120px;border-bottom:1px solid #E6EBF1;display:grid;grid-template-columns:repeat(4,1fr)\">\n  <div style=\"padding:22px 24px 22px 0;font-size:14.5px;font-weight:500;color:#0B1F3A;display:flex;gap:10px;align-items:center\"><span style=\"font-weight:500;font-size:11px;color:#2E8B82\">01<\u002Fspan>Physician-reviewed evaluation and plan<\u002Fdiv>\n  <div style=\"padding:22px 24px;font-size:14.5px;font-weight:500;color:#0B1F3A;display:flex;gap:10px;align-items:center;border-left:1px solid #E6EBF1\"><span style=\"font-weight:500;font-size:11px;color:#2E8B82\">02<\u002Fspan>Labs interpreted by a physician, not a threshold<\u002Fdiv>\n  <div style=\"padding:22px 24px;font-size:14.5px;font-weight:500;color:#0B1F3A;display:flex;gap:10px;align-items:center;border-left:1px solid #E6EBF1\"><span style=\"font-weight:500;font-size:11px;color:#2E8B82\">03<\u002Fspan>Transparent cash-pay options<\u002Fdiv>\n  <div style=\"padding:22px 0 22px 24px;font-size:14.5px;font-weight:500;color:#0B1F3A;display:flex;gap:10px;align-items:center;border-left:1px solid #E6EBF1\"><span style=\"font-weight:500;font-size:11px;color:#2E8B82\">04<\u002Fspan>Local Northwest Indiana care<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:112px 120px 96px;display:grid;grid-template-columns:320px 1fr;gap:64px\">\n  <span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82;padding-top:8px\">Our approach<\u002Fspan>\n  <p style=\"margin:0;font-weight:500;font-size:34px;line-height:1.3;letter-spacing:-.025em;color:#0B1F3A;text-wrap:pretty\">Most wellness clinics start with a product and add a provider. Apex starts with a physician. Your history, concerns, goals, and appropriate testing are reviewed by a physician before any plan is written, and a physician remains responsible for dosing, monitoring, and follow-up.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"padding:0 120px 112px;display:flex;flex-direction:column;gap:32px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:40px\">\n    <h2 style=\"margin:0;font-weight:600;font-size:40px;letter-spacing:-.035em;line-height:1.1\">Three areas of care<\u002Fh2>\n    <span style=\"font-size:15px;color:#425466\">Three focused lanes. One physician-managed standard.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #E6EBF1;border-radius:10px;overflow:hidden\">\n    <a href=\"#weight\" style=\"display:flex;flex-direction:column;gap:16px;padding:28px;color:#0B1F3A;border-right:1px solid #E6EBF1\" style-hover=\"background:#F6F9FC;color:#0B1F3A\">\n      <div style=\"height:180px\"><image-slot id=\"s-card-weight\" shape=\"rounded\" radius=\"6\" placeholder=\"Plan review, calm setting\"><\u002Fimage-slot><\u002Fdiv>\n      <span style=\"font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">Care area 01<\u002Fspan>\n      <h3 style=\"margin:0;font-weight:600;font-size:22px;line-height:1.2;letter-spacing:-.025em\">Medical Weight and Metabolic Care<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;color:#425466;flex:1;text-wrap:pretty\">Physician-managed weight and metabolic care: appropriate evaluation, measurements, medication only when indicated, and ongoing support.<\u002Fp>\n      <span style=\"font-size:14.5px;font-weight:500;color:#2E8B82\">Learn more →<\u002Fspan>\n    <\u002Fa>\n    <a href=\"#men\" style=\"display:flex;flex-direction:column;gap:16px;padding:28px;color:#0B1F3A;border-right:1px solid #E6EBF1\" style-hover=\"background:#F6F9FC;color:#0B1F3A\">\n      <div style=\"height:180px\"><image-slot id=\"s-card-men\" shape=\"rounded\" radius=\"6\" placeholder=\"Private consultation room\"><\u002Fimage-slot><\u002Fdiv>\n      <span style=\"font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">Care area 02<\u002Fspan>\n      <h3 style=\"margin:0;font-weight:600;font-size:22px;line-height:1.2;letter-spacing:-.025em\">Men's Hormone Health<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;color:#425466;flex:1;text-wrap:pretty\">Physician-reviewed evaluation, testing, and monitoring for men with symptoms or findings that may warrant hormone-related care.<\u002Fp>\n      <span style=\"font-size:14.5px;font-weight:500;color:#2E8B82\">Learn more →<\u002Fspan>\n    <\u002Fa>\n    <a href=\"#women\" style=\"display:flex;flex-direction:column;gap:16px;padding:28px;color:#0B1F3A\" style-hover=\"background:#F6F9FC;color:#0B1F3A\">\n      <div style=\"height:180px\"><image-slot id=\"s-card-women\" shape=\"rounded\" radius=\"6\" placeholder=\"Clinician listening\"><\u002Fimage-slot><\u002Fdiv>\n      <span style=\"font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">Care area 03<\u002Fspan>\n      <h3 style=\"margin:0;font-weight:600;font-size:22px;line-height:1.2;letter-spacing:-.025em\">Women's Midlife Hormone and Metabolic Care<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;color:#425466;flex:1;text-wrap:pretty\">Physician-reviewed risk assessment and individualized options for perimenopause, menopause, weight, and metabolic concerns.<\u002Fp>\n      <span style=\"font-size:14.5px;font-weight:500;color:#2E8B82\">Learn more →<\u002Fspan>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#F6F9FC;border-top:1px solid #E6EBF1;border-bottom:1px solid #E6EBF1;padding:96px 120px;display:flex;flex-direction:column;gap:48px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">How it works<\u002Fspan><h2 style=\"margin:0;font-weight:600;font-size:40px;letter-spacing:-.035em;line-height:1.1\">Nothing begins before a physician has reviewed your case.<\u002Fh2><\u002Fdiv>\n    <a href=\"#how\" style=\"color:#0B1F3A;padding:10px 16px;border-radius:6px;font-weight:500;font-size:14.5px;border:1px solid #D5DCE5;background:#fff\" style-hover=\"border-color:#0B1F3A\">See the full journey<\u002Fa>\n  <\u002Fdiv>\n  <ol style=\"margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid #D5DCE5\">\n    <li style=\"padding:24px 24px 0 0;display:flex;flex-direction:column;gap:10px;position:relative\"><span style=\"position:absolute;top:-1px;left:0;width:48px;height:2px;background:#2E8B82\"><\u002Fspan><span style=\"font-weight:500;font-size:11.5px;color:#8792A2\">STEP 01<\u002Fspan><strong style=\"font-weight:600;font-size:19px;letter-spacing:-.02em\">Choose your care area.<\u002Fstrong><span style=\"font-size:15px;color:#425466\">Review the service that best matches your concern.<\u002Fspan><\u002Fli>\n    <li style=\"padding:24px 24px 0 24px;display:flex;flex-direction:column;gap:10px;position:relative;border-left:1px solid #D5DCE5\"><span style=\"position:absolute;top:-1px;left:24px;width:48px;height:2px;background:#2E8B82\"><\u002Fspan><span style=\"font-weight:500;font-size:11.5px;color:#8792A2\">STEP 02<\u002Fspan><strong style=\"font-weight:600;font-size:19px;letter-spacing:-.02em\">Complete an evaluation.<\u002Fstrong><span style=\"font-size:15px;color:#425466\">Meet with a licensed clinician. A physician reviews your history, risks, and goals.<\u002Fspan><\u002Fli>\n    <li style=\"padding:24px 24px 0 24px;display:flex;flex-direction:column;gap:10px;position:relative;border-left:1px solid #D5DCE5\"><span style=\"position:absolute;top:-1px;left:24px;width:48px;height:2px;background:#2E8B82\"><\u002Fspan><span style=\"font-weight:500;font-size:11.5px;color:#8792A2\">STEP 03<\u002Fspan><strong style=\"font-weight:600;font-size:19px;letter-spacing:-.02em\">Complete appropriate testing.<\u002Fstrong><span style=\"font-size:15px;color:#425466\">Labs or measurements are ordered only when clinically indicated, and a physician interprets them.<\u002Fspan><\u002Fli>\n    <li style=\"padding:24px 0 0 24px;display:flex;flex-direction:column;gap:10px;position:relative;border-left:1px solid #D5DCE5\"><span style=\"position:absolute;top:-1px;left:24px;width:48px;height:2px;background:#2E8B82\"><\u002Fspan><span style=\"font-weight:500;font-size:11.5px;color:#8792A2\">STEP 04<\u002Fspan><strong style=\"font-weight:600;font-size:19px;letter-spacing:-.02em\">Review a physician-reviewed plan.<\u002Fstrong><span style=\"font-size:15px;color:#425466\">Understand your options, total costs, follow-up, and next steps before beginning care.<\u002Fspan><\u002Fli>\n  <\u002Fol>\n<\u002Fsection>\n\n<section style=\"padding:104px 120px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:80px;align-items:center\">\n  <div style=\"height:460px\"><image-slot id=\"s-why\" shape=\"rounded\" radius=\"10\" placeholder=\"Patient and clinician reviewing measurements\"><\u002Fimage-slot><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:24px\">\n    <span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">Why Apex<\u002Fspan>\n    <h2 style=\"margin:0;font-weight:600;font-size:40px;letter-spacing:-.035em;line-height:1.1\">What physician management means here.<\u002Fh2>\n    <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column\">\n      <li style=\"padding:14px 0;border-top:1px solid #E6EBF1;font-size:17px;display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:500;font-size:11.5px;color:#8792A2\">01<\u002Fspan>A physician reviews every evaluation, lab result, and written plan.<\u002Fli>\n      <li style=\"padding:14px 0;border-top:1px solid #E6EBF1;font-size:17px;display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:500;font-size:11.5px;color:#8792A2\">02<\u002Fspan>Dose changes and monitoring decisions are made by a physician, not a protocol.<\u002Fli>\n      <li style=\"padding:14px 0;border-top:1px solid #E6EBF1;font-size:17px;display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:500;font-size:11.5px;color:#8792A2\">03<\u002Fspan>Focused on three care areas rather than a menu, with clear fees and exclusions.<\u002Fli>\n      <li style=\"padding:14px 0;border-top:1px solid #E6EBF1;font-size:17px;display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:500;font-size:11.5px;color:#8792A2\">04<\u002Fspan>Measurable progress, tracked and reviewed, without guaranteed outcomes.<\u002Fli>\n      <li style=\"padding:14px 0;border-top:1px solid #E6EBF1;border-bottom:1px solid #E6EBF1;font-size:17px;display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:500;font-size:11.5px;color:#8792A2\">05<\u002Fspan>Referral when another physician is the right destination.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin:0 120px;border:1px solid #E6EBF1;border-radius:10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);overflow:hidden\">\n  <div style=\"padding:48px;display:flex;flex-direction:column;gap:14px;border-right:1px solid #E6EBF1\">\n    <span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#B8963E\">Founding 25<\u002Fspan>\n    <h2 style=\"margin:0;font-weight:600;font-size:32px;letter-spacing:-.03em;line-height:1.15\">Twenty-five founding evaluations before opening day.<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;color:#425466;text-wrap:pretty\">Founding patients receive priority scheduling for the initial evaluation and a no-charge 90-day progress review. The evaluation fee and full terms are shared before any payment.<\u002Fp>\n    <p style=\"margin:0;font-size:13.5px;color:#8792A2\">Payment does not guarantee treatment or a prescription. Labs and medication are separate.<\u002Fp>\n    <a href=\"#priority\" style=\"margin-top:8px;align-self:flex-start;background:#0B1F3A;color:#fff;padding:11px 16px;border-radius:6px;font-weight:500;font-size:14.5px\" style-hover=\"background:#2E8B82;color:#fff\">Reserve a founding evaluation →<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"padding:48px;background:#F6F9FC;display:flex;flex-direction:column;gap:14px\">\n    <span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">Location<\u002Fspan>\n    <h2 style=\"margin:0;font-weight:600;font-size:32px;letter-spacing:-.03em;line-height:1.15\">{{ locationHeadline }}<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;color:#425466\">{{ locationCopy }}<\u002Fp>\n    <p style=\"margin:0;font-size:14px;color:#8792A2\">Serving Merrillville, Crown Point, Schererville, Munster, Dyer, St. John, Highland, Hobart, and surrounding communities.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:112px 120px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px\">\n  <h2 style=\"margin:0;font-weight:600;font-size:44px;letter-spacing:-.04em;line-height:1.05\">Ready for a clearer next step?<\u002Fh2>\n  <p style=\"margin:0;font-size:17px;color:#425466;max-width:520px\">Join the Apex Wellness priority list for launch updates and appointment availability.<\u002Fp>\n  <a href=\"#priority\" style=\"margin-top:10px;background:#0B1F3A;color:#fff;padding:13px 20px;border-radius:6px;font-weight:500;font-size:15px\" style-hover=\"background:#2E8B82;color:#fff\">{{ ctaLabel }} →<\u002Fa>\n<\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ============ CARE PAGE (weight / men / women) ============ -->\n<sc-if value=\"{{ isCare }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Care page\">\n<section style=\"padding:80px 120px 64px;border-bottom:1px solid #E6EBF1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:64px;align-items:end\">\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">{{ lane.eyebrow }}<\u002Fspan>\n    <h1 style=\"margin:0;font-weight:600;font-size:54px;line-height:1.04;letter-spacing:-.04em;text-wrap:pretty\">{{ lane.headline }}<\u002Fh1>\n    <p style=\"margin:0;font-size:18px;color:#425466;max-width:560px;text-wrap:pretty\">{{ lane.intro }}<\u002Fp>\n    <div style=\"display:flex;gap:12px;align-items:center;padding-top:4px\"><a href=\"#priority\" style=\"background:#0B1F3A;color:#fff;padding:12px 18px;border-radius:6px;font-weight:500;font-size:15px\" style-hover=\"background:#2E8B82;color:#fff\">{{ lane.cta }} →<\u002Fa><span style=\"font-size:13px;color:#8792A2\">Evaluation required. Payment does not guarantee treatment.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"height:400px\"><image-slot id=\"{{ lane.imgId }}\" shape=\"rounded\" radius=\"10\" placeholder=\"{{ lane.imgPlaceholder }}\"><\u002Fimage-slot><\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:0 120px;display:grid;grid-template-columns:280px 1fr\">\n  <aside style=\"padding:56px 40px 56px 0;border-right:1px solid #E6EBF1;position:sticky;top:64px;align-self:start;display:flex;flex-direction:column;gap:2px;font-size:14px\">\n    <span style=\"font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8792A2;margin-bottom:12px\">On this page<\u002Fspan>\n    <span style=\"padding:6px 0;color:#0B1F3A;font-weight:500\">Who this may be for<\u002Fspan>\n    <span style=\"padding:6px 0;color:#425466\">The initial evaluation<\u002Fspan>\n    <span style=\"padding:6px 0;color:#425466\">Testing and measurements<\u002Fspan>\n    <span style=\"padding:6px 0;color:#425466\">Treatment categories<\u002Fspan>\n    <span style=\"padding:6px 0;color:#425466\">Ongoing follow-up<\u002Fspan>\n    <span style=\"padding:6px 0;color:#425466\">Cost<\u002Fspan>\n    <span style=\"padding:6px 0;color:#425466\">When we refer or decline<\u002Fspan>\n    <span style=\"padding:6px 0;color:#425466\">Questions<\u002Fspan>\n  <\u002Faside>\n  <div style=\"padding:56px 0 96px 64px;display:flex;flex-direction:column;gap:64px;max-width:820px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\"><h2 style=\"margin:0;font-weight:600;font-size:28px;letter-spacing:-.03em\">Who this may be for<\u002Fh2><p style=\"margin:0;font-size:16.5px;color:#425466;text-wrap:pretty\">{{ lane.who }}<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\"><h2 style=\"margin:0;font-weight:600;font-size:28px;letter-spacing:-.03em\">The initial evaluation<\u002Fh2><p style=\"margin:0;font-size:16.5px;color:#425466;text-wrap:pretty\">{{ lane.evaluation }}<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\"><h2 style=\"margin:0;font-weight:600;font-size:28px;letter-spacing:-.03em\">Testing and measurements that may be considered<\u002Fh2><p style=\"margin:0;font-size:16.5px;color:#425466;text-wrap:pretty\">{{ lane.testing }}<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:18px\"><h2 style=\"margin:0;font-weight:600;font-size:28px;letter-spacing:-.03em\">Treatment categories we discuss<\u002Fh2><p style=\"margin:0;font-size:16.5px;color:#425466;text-wrap:pretty\">{{ lane.treatIntro }}<\u002Fp>\n      <ul style=\"margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#E6EBF1;border:1px solid #E6EBF1;border-radius:8px;overflow:hidden\">\n        <sc-for list=\"{{ lane.treatments }}\" as=\"t\" hint-placeholder-count=\"4\"><li style=\"background:#fff;padding:18px 20px;font-size:15px;display:flex;flex-direction:column;gap:4px\"><strong style=\"font-weight:600;letter-spacing:-.01em\">{{ t.name }}<\u002Fstrong><span style=\"color:#425466\">{{ t.note }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n      <\u002Ful>\n      <p style=\"margin:0;font-size:14px;color:#8792A2\">{{ lane.treatDisclaimer }}<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\"><h2 style=\"margin:0;font-weight:600;font-size:28px;letter-spacing:-.03em\">What ongoing follow-up includes<\u002Fh2><p style=\"margin:0;font-size:16.5px;color:#425466;text-wrap:pretty\">{{ lane.followup }}<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px;padding:28px;border:1px solid #E6EBF1;border-radius:10px;background:#F6F9FC\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\"><h2 style=\"margin:0;font-weight:600;font-size:24px;letter-spacing:-.03em\">Cost<\u002Fh2><span style=\"font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#B8963E;border:1px solid #E3D3A6;padding:4px 8px;border-radius:4px;background:#fff\">Final pricing pending approval<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;font-size:15px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-weight:500;font-size:11px;color:#8792A2;text-transform:uppercase;letter-spacing:.06em\">Evaluation<\u002Fspan><span style=\"color:#0B1F3A;font-weight:500\">One-time fee, stated before booking<\u002Fspan><span style=\"color:#425466\">Credited toward enrollment per published terms.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-weight:500;font-size:11px;color:#8792A2;text-transform:uppercase;letter-spacing:.06em\">Monthly fee includes<\u002Fspan><span style=\"color:#425466\">{{ lane.includes }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-weight:500;font-size:11px;color:#8792A2;text-transform:uppercase;letter-spacing:.06em\">Billed separately<\u002Fspan><span style=\"color:#425466\">{{ lane.excludes }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"#pricing\" style=\"font-size:14.5px;font-weight:500;color:#2E8B82\">See the full pricing page, including a likely first-90-day total →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\"><h2 style=\"margin:0;font-weight:600;font-size:28px;letter-spacing:-.03em\">When Apex will refer or decline care<\u002Fh2><p style=\"margin:0;font-size:16.5px;color:#425466;text-wrap:pretty\">{{ lane.refer }}<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><h2 style=\"margin:0 0 8px;font-weight:600;font-size:28px;letter-spacing:-.03em\">Questions about this care area<\u002Fh2>\n      <sc-for list=\"{{ lane.faq }}\" as=\"q\" hint-placeholder-count=\"3\"><details style=\"border-top:1px solid #E6EBF1;padding:16px 0\"><summary style=\"display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size:16.5px;letter-spacing:-.01em;gap:20px\">{{ q.q }}<span class=\"chev\" style=\"font-weight:500;color:#8792A2;transition:transform .2s\">+<\u002Fspan><\u002Fsummary><p style=\"margin:12px 0 0;font-size:15.5px;color:#425466;max-width:680px\">{{ q.a }}<\u002Fp><\u002Fdetails><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;gap:24px;padding:28px 0 0;border-top:1px solid #E6EBF1\"><div style=\"display:flex;flex-direction:column;gap:4px\"><strong style=\"font-weight:600;font-size:20px;letter-spacing:-.02em\">Start with an evaluation.<\u002Fstrong><span style=\"font-size:14px;color:#8792A2\">Eligibility is determined by a licensed clinician. Payment does not guarantee treatment or a prescription.<\u002Fspan><\u002Fdiv><a href=\"#priority\" style=\"flex:none;background:#0B1F3A;color:#fff;padding:12px 18px;border-radius:6px;font-weight:500;font-size:15px\" style-hover=\"background:#2E8B82;color:#fff\">{{ lane.cta }} →<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ============ HOW IT WORKS ============ -->\n<sc-if value=\"{{ isHow }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"How It Works\">\n<section style=\"padding:80px 120px 56px;display:flex;flex-direction:column;gap:20px;max-width:900px\">\n  <span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">How it works<\u002Fspan>\n  <h1 style=\"margin:0;font-weight:600;font-size:54px;line-height:1.04;letter-spacing:-.04em\">Four steps, each under physician review.<\u002Fh1>\n  <p style=\"margin:0;font-size:18px;color:#425466;text-wrap:pretty\">A physician reviews your evaluation, interprets your labs, and signs off on your plan before anything begins. The first visit is built to have enough time to explain findings.<\u002Fp>\n<\u002Fsection>\n<section style=\"padding:0 120px 96px;display:flex;flex-direction:column\">\n  <div style=\"display:grid;grid-template-columns:120px 1fr 1fr;gap:40px;padding:36px 0;border-top:1px solid #E6EBF1\"><span style=\"font-weight:500;font-size:13px;color:#2E8B82\">STEP 01<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px\"><strong style=\"font-weight:600;font-size:24px;letter-spacing:-.025em\">Choose your care area.<\u002Fstrong><span style=\"font-size:16px;color:#425466\">Review the service that best matches your concern.<\u002Fspan><\u002Fdiv><span style=\"font-size:15px;color:#425466;text-wrap:pretty\">Weight and metabolic, men's hormone, or women's midlife care. If you are unsure, tell us in the form and the Patient Concierge will help you choose.<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:120px 1fr 1fr;gap:40px;padding:36px 0;border-top:1px solid #E6EBF1\"><span style=\"font-weight:500;font-size:13px;color:#2E8B82\">STEP 02<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px\"><strong style=\"font-weight:600;font-size:24px;letter-spacing:-.025em\">Complete an evaluation.<\u002Fstrong><span style=\"font-size:16px;color:#425466\">Meet with a licensed clinician. A physician reviews your history, risks, and goals.<\u002Fspan><\u002Fdiv><span style=\"font-size:15px;color:#425466;text-wrap:pretty\">Your history, concerns, goals, and risks are reviewed with time to talk. The visit fee is stated before booking; clinical history is collected only through secure intake.<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:120px 1fr 1fr;gap:40px;padding:36px 0;border-top:1px solid #E6EBF1\"><span style=\"font-weight:500;font-size:13px;color:#2E8B82\">STEP 03<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px\"><strong style=\"font-weight:600;font-size:24px;letter-spacing:-.025em\">Complete appropriate testing.<\u002Fstrong><span style=\"font-size:16px;color:#425466\">Labs or measurements are ordered only when clinically indicated, and a physician interprets them.<\u002Fspan><\u002Fdiv><span style=\"font-size:15px;color:#425466;text-wrap:pretty\">Recent outside labs may be reviewed. Testing is billed separately and explained in advance.<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:120px 1fr 1fr;gap:40px;padding:36px 0;border-top:1px solid #E6EBF1;border-bottom:1px solid #E6EBF1\"><span style=\"font-weight:500;font-size:13px;color:#2E8B82\">STEP 04<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px\"><strong style=\"font-weight:600;font-size:24px;letter-spacing:-.025em\">Review a physician-reviewed plan.<\u002Fstrong><span style=\"font-size:16px;color:#425466\">Understand your options, total costs, follow-up, and next steps before beginning care.<\u002Fspan><\u002Fdiv><span style=\"font-size:15px;color:#425466;text-wrap:pretty\">A written plan covers findings, options including no treatment, complete cost, follow-up schedule, and when we would refer you to another clinician.<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n<section style=\"background:#F6F9FC;border-top:1px solid #E6EBF1;padding:88px 120px;display:grid;grid-template-columns:1fr 1fr;gap:64px\">\n  <div style=\"display:flex;flex-direction:column;gap:16px\"><span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">After the visit<\u002Fspan><h2 style=\"margin:0;font-weight:600;font-size:36px;letter-spacing:-.035em;line-height:1.1\">Physician follow-through is part of the fee, not an upsell.<\u002Fh2><\u002Fdiv>\n  <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column\">\n    <li style=\"padding:16px 0;border-top:1px solid #D5DCE5;font-size:16.5px;display:flex;gap:16px\"><span style=\"font-weight:500;font-size:11.5px;color:#8792A2;padding-top:4px\">01<\u002Fspan>Results, side effects, refills, and dose adjustments reviewed by a physician, with defined response expectations.<\u002Fli>\n    <li style=\"padding:16px 0;border-top:1px solid #D5DCE5;font-size:16.5px;display:flex;gap:16px\"><span style=\"font-weight:500;font-size:11.5px;color:#8792A2;padding-top:4px\">02<\u002Fspan>Scheduled follow-up visits and lab checks on a cadence set in your plan.<\u002Fli>\n    <li style=\"padding:16px 0;border-top:1px solid #D5DCE5;font-size:16.5px;display:flex;gap:16px\"><span style=\"font-weight:500;font-size:11.5px;color:#8792A2;padding-top:4px\">03<\u002Fspan>Progress tracked with symptoms, measurements, laboratory data, function, adherence, and side effects.<\u002Fli>\n    <li style=\"padding:16px 0;border-top:1px solid #D5DCE5;border-bottom:1px solid #D5DCE5;font-size:16.5px;display:flex;gap:16px\"><span style=\"font-weight:500;font-size:11.5px;color:#8792A2;padding-top:4px\">04<\u002Fspan>One intervention at a time when clinically appropriate, with a plan for maintenance or discontinuation.<\u002Fli>\n  <\u002Ful>\n<\u002Fsection>\n<section style=\"padding:96px 120px;display:flex;justify-content:space-between;align-items:center;gap:40px\"><h2 style=\"margin:0;font-weight:600;font-size:36px;letter-spacing:-.035em\">Get started<\u002Fh2><a href=\"#priority\" style=\"background:#0B1F3A;color:#fff;padding:13px 20px;border-radius:6px;font-weight:500;font-size:15px\" style-hover=\"background:#2E8B82;color:#fff\">{{ ctaLabel }} →<\u002Fa><\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ============ PRICING ============ -->\n<sc-if value=\"{{ isPricing }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Pricing\">\n<section style=\"padding:80px 120px 48px;display:flex;flex-direction:column;gap:20px;max-width:900px\">\n  <span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">Pricing<\u002Fspan>\n  <h1 style=\"margin:0;font-weight:600;font-size:54px;line-height:1.04;letter-spacing:-.04em\">The easiest clinic in the region to understand.<\u002Fh1>\n  <p style=\"margin:0;font-size:18px;color:#425466;text-wrap:pretty\">One evaluation fee. One calendar-month fee per care area that includes physician review and management. Labs, medication, and shipping shown separately, never hidden behind a headline price.<\u002Fp>\n  <div style=\"display:inline-flex;align-self:flex-start;gap:10px;align-items:center;font-size:13.5px;color:#7A6224;background:#FBF6E8;border:1px solid #E3D3A6;border-radius:6px;padding:8px 12px\"><span style=\"font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase\">Note<\u002Fspan>Final amounts are published after clinical and vendor approval. Structure below is final; numbers are placeholders.<\u002Fdiv>\n<\u002Fsection>\n<section style=\"padding:0 120px 64px\">\n  <div style=\"border:1px solid #E6EBF1;border-radius:10px;overflow:hidden;font-size:15px\">\n    <div style=\"display:grid;grid-template-columns:1.3fr 1.5fr 1.3fr .8fr;background:#F6F9FC;border-bottom:1px solid #E6EBF1;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8792A2\"><span style=\"padding:14px 20px\">Offer<\u002Fspan><span style=\"padding:14px 20px\">Included<\u002Fspan><span style=\"padding:14px 20px\">Billed separately<\u002Fspan><span style=\"padding:14px 20px;text-align:right\">Price<\u002Fspan><\u002Fdiv>\n    <sc-for list=\"{{ priceRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n      <div style=\"display:grid;grid-template-columns:1.3fr 1.5fr 1.3fr .8fr;border-bottom:1px solid #E6EBF1;align-items:start\"><div style=\"padding:20px;display:flex;flex-direction:column;gap:4px\"><strong style=\"font-weight:600;letter-spacing:-.01em\">{{ r.name }}<\u002Fstrong><span style=\"font-size:13px;color:#8792A2\">{{ r.cadence }}<\u002Fspan><\u002Fdiv><span style=\"padding:20px;color:#425466\">{{ r.included }}<\u002Fspan><span style=\"padding:20px;color:#425466\">{{ r.excluded }}<\u002Fspan><div style=\"padding:20px;display:flex;flex-direction:column;align-items:flex-end;gap:4px\"><span style=\"font-weight:500;font-size:18px;color:#0B1F3A;font-variant-numeric:tabular-nums\">{{ r.price }}<\u002Fspan><span style=\"font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#B8963E\">Pending<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n<section style=\"padding:0 120px 96px;display:grid;grid-template-columns:1fr 1fr;gap:64px\">\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <h2 style=\"margin:0;font-weight:600;font-size:30px;letter-spacing:-.03em\">What your first 90 days may cost<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;color:#425466;text-wrap:pretty\">After final vendor quotes we publish a representative first-90-day total for each care area, combining the evaluation, monthly fees, typical labs, and medication where applicable. Individual costs vary with clinical need.<\u002Fp>\n    <div style=\"border:1px solid #E6EBF1;border-radius:8px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:10px 24px;font-size:15px;font-variant-numeric:tabular-nums\">\n      <span style=\"color:#425466\">Initial evaluation<\u002Fspan><span style=\"font-weight:500;color:#8792A2\">$ ———<\u002Fspan>\n      <span style=\"color:#425466\">Baseline labs (external)<\u002Fspan><span style=\"font-weight:500;color:#8792A2\">$ ———<\u002Fspan>\n      <span style=\"color:#425466\">Months 1–3 clinical fee<\u002Fspan><span style=\"font-weight:500;color:#8792A2\">$ ———<\u002Fspan>\n      <span style=\"color:#425466\">Medication, if prescribed<\u002Fspan><span style=\"font-weight:500;color:#8792A2\">$ ———<\u002Fspan>\n      <span style=\"font-weight:600;border-top:1px solid #E6EBF1;padding-top:10px\">Representative 90-day total<\u002Fspan><span style=\"font-weight:500;font-weight:500;border-top:1px solid #E6EBF1;padding-top:10px\">$ ———<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:8px\">\n    <h2 style=\"margin:0 0 8px;font-weight:600;font-size:30px;letter-spacing:-.03em\">Billing, plainly<\u002Fh2>\n    <sc-for list=\"{{ pricingFaq }}\" as=\"q\" hint-placeholder-count=\"5\"><details style=\"border-top:1px solid #E6EBF1;padding:14px 0\"><summary style=\"display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size:16px;gap:20px\">{{ q.q }}<span class=\"chev\" style=\"font-weight:500;color:#8792A2;transition:transform .2s\">+<\u002Fspan><\u002Fsummary><p style=\"margin:10px 0 0;font-size:15px;color:#425466\">{{ q.a }}<\u002Fp><\u002Fdetails><\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n<section style=\"border-top:1px solid #E6EBF1;padding:72px 120px;display:flex;justify-content:space-between;align-items:center;gap:40px\"><div style=\"display:flex;flex-direction:column;gap:6px\"><h2 style=\"margin:0;font-weight:600;font-size:32px;letter-spacing:-.035em\">View availability<\u002Fh2><span style=\"font-size:14.5px;color:#8792A2\">Payment does not guarantee treatment or a prescription.<\u002Fspan><\u002Fdiv><a href=\"#priority\" style=\"background:#0B1F3A;color:#fff;padding:13px 20px;border-radius:6px;font-weight:500;font-size:15px\" style-hover=\"background:#2E8B82;color:#fff\">{{ ctaLabel }} →<\u002Fa><\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ============ ABOUT + TEAM ============ -->\n<sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"About\">\n<section style=\"padding:80px 120px 72px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:end;border-bottom:1px solid #E6EBF1\">\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">About Apex<\u002Fspan>\n    <h1 style=\"margin:0;font-weight:600;font-size:54px;line-height:1.04;letter-spacing:-.04em\">A physician-managed practice for adults tired of vague answers.<\u002Fh1>\n    <p style=\"margin:0;font-size:18px;color:#425466;text-wrap:pretty\">Apex Wellness exists to make weight and hormone care understandable and accountable for Northwest Indiana adults: a physician reviews every evaluation and plan, pricing is clear, and follow-through is dependable.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"height:380px\"><image-slot id=\"s-about\" shape=\"rounded\" radius=\"10\" placeholder=\"Reception or consultation space\"><\u002Fimage-slot><\u002Fdiv>\n<\u002Fsection>\n<section style=\"padding:88px 120px;display:grid;grid-template-columns:320px 1fr;gap:64px\">\n  <span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82;padding-top:6px\">Our standards<\u002Fspan>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#E6EBF1;border:1px solid #E6EBF1;border-radius:10px;overflow:hidden\">\n    <div style=\"background:#fff;padding:28px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font-weight:600;font-size:19px;letter-spacing:-.02em\">Clarity<\u002Fstrong><span style=\"font-size:15px;color:#425466\">People understand what happens, what it costs, and what comes next.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;padding:28px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font-weight:600;font-size:19px;letter-spacing:-.02em\">Credibility<\u002Fstrong><span style=\"font-size:15px;color:#425466\">Care begins with a physician-reviewed evaluation and clinical judgment, not a guaranteed product.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;padding:28px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font-weight:600;font-size:19px;letter-spacing:-.02em\">Continuity<\u002Fstrong><span style=\"font-size:15px;color:#425466\">The patient is supported after the evaluation, prescription, or treatment plan.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;padding:28px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font-weight:600;font-size:19px;letter-spacing:-.02em\">Measurement<\u002Fstrong><span style=\"font-size:15px;color:#425466\">Progress is tracked with symptoms, measurements, laboratory data, function, adherence, and side effects.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;padding:28px;display:flex;flex-direction:column;gap:8px;grid-column:1/-1\"><strong style=\"font-weight:600;font-size:19px;letter-spacing:-.02em\">Respect<\u002Fstrong><span style=\"font-size:15px;color:#425466\">The experience is private, inclusive, nonjudgmental, and designed for busy adults.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section style=\"background:#F6F9FC;border-top:1px solid #E6EBF1;border-bottom:1px solid #E6EBF1;padding:88px 120px;display:flex;flex-direction:column;gap:40px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:40px\"><div style=\"display:flex;flex-direction:column;gap:12px\"><span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">Clinical team<\u002Fspan><h2 style=\"margin:0;font-weight:600;font-size:36px;letter-spacing:-.035em;line-height:1.1\">Who is responsible for your care<\u002Fh2><\u002Fdiv><span style=\"font-size:14px;color:#8792A2;max-width:380px;text-align:right\">Biographies, credentials, and roles are published only after verification and approval.<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\">\n    <div style=\"background:#fff;border:1px solid #E6EBF1;border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px\"><div style=\"width:88px;height:88px\"><image-slot id=\"s-team-1\" shape=\"circle\" placeholder=\"Headshot\"><\u002Fimage-slot><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px\"><strong style=\"font-weight:600;font-size:18px;letter-spacing:-.02em\">[Physician / medical director]<\u002Fstrong><span style=\"font-size:14px;color:#425466\">[Degree / license] · [Role at Apex]<\u002Fspan><\u002Fdiv><span style=\"font-size:14.5px;color:#425466\">Reviews every evaluation, lab result, and plan; responsible for dosing and monitoring decisions. Credentials and care philosophy published after approval.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E6EBF1;border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px\"><div style=\"width:88px;height:88px\"><image-slot id=\"s-team-2\" shape=\"circle\" placeholder=\"Headshot\"><\u002Fimage-slot><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px\"><strong style=\"font-weight:600;font-size:18px;letter-spacing:-.02em\">[Treating clinician]<\u002Fstrong><span style=\"font-size:14px;color:#425466\">[Degree / license] · [Role at Apex]<\u002Fspan><\u002Fdiv><span style=\"font-size:14.5px;color:#425466\">Conducts evaluations and follow-up visits under physician management. Publish only with the approved title and scope.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E6EBF1;border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px\"><div style=\"width:88px;height:88px\"><image-slot id=\"s-team-3\" shape=\"circle\" placeholder=\"Headshot\"><\u002Fimage-slot><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px\"><strong style=\"font-weight:600;font-size:18px;letter-spacing:-.02em\">[Founder, operations]<\u002Fstrong><span style=\"font-size:14px;color:#425466\">Nonclinical · [Role at Apex]<\u002Fspan><\u002Fdiv><span style=\"font-size:14.5px;color:#425466\">Origin story and operations mission. No clinical credential or authority is implied.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section style=\"padding:88px 120px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px\">\n  <div style=\"display:flex;flex-direction:column;gap:14px\"><span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">Location and contact<\u002Fspan><h2 style=\"margin:0;font-weight:600;font-size:36px;letter-spacing:-.035em;line-height:1.1\">{{ locationHeadline }}<\u002Fh2><p style=\"margin:0;font-size:16px;color:#425466\">{{ locationCopy }}<\u002Fp><p style=\"margin:0;font-size:14px;color:#8792A2\">Phone, email, and hours will be published when dedicated clinic channels are live. For now, the priority list is the fastest way to reach the Patient Concierge.<\u002Fp><a href=\"#priority\" style=\"align-self:flex-start;margin-top:6px;background:#0B1F3A;color:#fff;padding:11px 16px;border-radius:6px;font-weight:500;font-size:14.5px\" style-hover=\"background:#2E8B82;color:#fff\">Contact Apex →<\u002Fa><\u002Fdiv>\n  <div style=\"height:300px\"><image-slot id=\"s-map\" shape=\"rounded\" radius=\"10\" placeholder=\"Map and exterior, once the address is approved\"><\u002Fimage-slot><\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ============ FAQ ============ -->\n<sc-if value=\"{{ isFaq }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"FAQ\">\n<section style=\"padding:80px 120px 96px;display:grid;grid-template-columns:320px 1fr;gap:64px\">\n  <div style=\"display:flex;flex-direction:column;gap:16px;position:sticky;top:96px;align-self:start\"><span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2E8B82\">FAQ<\u002Fspan><h1 style=\"margin:0;font-weight:600;font-size:44px;line-height:1.05;letter-spacing:-.04em\">Questions, answered before you pay.<\u002Fh1><p style=\"margin:0;font-size:15.5px;color:#425466\">Something missing? Ask through the priority-list form and the Patient Concierge will reply during covered hours.<\u002Fp><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:48px\">\n    <sc-for list=\"{{ faqGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n      <div style=\"display:flex;flex-direction:column\"><span style=\"font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#8792A2;padding-bottom:12px\">{{ g.title }}<\u002Fspan>\n        <sc-for list=\"{{ g.items }}\" as=\"q\" hint-placeholder-count=\"4\"><details style=\"border-top:1px solid #E6EBF1;padding:16px 0\"><summary style=\"display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size:16.5px;letter-spacing:-.01em;gap:20px\">{{ q.q }}<span class=\"chev\" style=\"font-weight:500;color:#8792A2;transition:transform .2s\">+<\u002Fspan><\u002Fsummary><p style=\"margin:12px 0 0;font-size:15.5px;color:#425466;max-width:680px\">{{ q.a }}<\u002Fp><\u002Fdetails><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ============ PRIORITY LIST ============ -->\n<sc-if value=\"{{ isPriority }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Priority List\">\n<section style=\"padding:80px 120px 112px;display:grid;grid-template-columns:1fr 1fr;gap:96px;align-items:start\">\n  <div style=\"display:flex;flex-direction:column;gap:24px;position:sticky;top:96px\">\n    <span style=\"font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#B8963E\">Founding 25 · Priority list<\u002Fspan>\n    <h1 style=\"margin:0;font-weight:600;font-size:54px;line-height:1.04;letter-spacing:-.04em\">{{ priorityHeadline }}<\u002Fh1>\n    <p style=\"margin:0;font-size:18px;color:#425466;text-wrap:pretty\">{{ priorityCopy }}<\u002Fp>\n    <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;font-size:15.5px\">\n      <li style=\"padding:14px 0;border-top:1px solid #E6EBF1;display:flex;gap:16px\"><span style=\"font-weight:500;font-size:11.5px;color:#8792A2;padding-top:3px\">01<\u002Fspan>The Patient Concierge responds during covered hours with availability and complete reservation terms.<\u002Fli>\n      <li style=\"padding:14px 0;border-top:1px solid #E6EBF1;display:flex;gap:16px\"><span style=\"font-weight:500;font-size:11.5px;color:#8792A2;padding-top:3px\">02<\u002Fspan>Founding patients receive priority scheduling and a no-charge 90-day progress review.<\u002Fli>\n      <li style=\"padding:14px 0;border-top:1px solid #E6EBF1;border-bottom:1px solid #E6EBF1;display:flex;gap:16px\"><span style=\"font-weight:500;font-size:11.5px;color:#8792A2;padding-top:3px\">03<\u002Fspan>Clinical history is collected only in the secure intake system after scheduling.<\u002Fli>\n    <\u002Ful>\n    <p style=\"margin:0;font-size:13.5px;color:#8792A2\">Payment does not guarantee treatment or a prescription. Cancellation, rescheduling, pause, and refund terms are provided before any payment.<\u002Fp>\n  <\u002Fdiv>\n  <form style=\"border:1px solid #E6EBF1;border-radius:10px;padding:32px;display:grid;grid-template-columns:1fr 1fr;gap:16px;box-shadow:0 1px 2px rgba(11,31,58,.04)\">\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;color:#425466\">First name<input style=\"border:1px solid #D5DCE5;border-radius:6px;padding:11px 12px;font:inherit;font-size:15px;color:#0B1F3A\"><\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;color:#425466\">Last name<input style=\"border:1px solid #D5DCE5;border-radius:6px;padding:11px 12px;font:inherit;font-size:15px;color:#0B1F3A\"><\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;color:#425466;grid-column:1/-1\">Email<input type=\"email\" style=\"border:1px solid #D5DCE5;border-radius:6px;padding:11px 12px;font:inherit;font-size:15px;color:#0B1F3A\"><\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;color:#425466\">Mobile phone <span style=\"font-weight:400;color:#8792A2\">(optional)<\u002Fspan><input type=\"tel\" style=\"border:1px solid #D5DCE5;border-radius:6px;padding:11px 12px;font:inherit;font-size:15px;color:#0B1F3A\"><\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;color:#425466\">ZIP code<input inputmode=\"numeric\" style=\"border:1px solid #D5DCE5;border-radius:6px;padding:11px 12px;font:inherit;font-size:15px;color:#0B1F3A\"><\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;color:#425466\">Care area of interest<sc-raw-select style=\"border:1px solid #D5DCE5;border-radius:6px;padding:11px 12px;font:inherit;font-size:15px;background:#fff;color:#0B1F3A\"><option>Medical weight and metabolic care<\u002Foption><option>Men's hormone health<\u002Foption><option>Women's midlife hormone and metabolic care<\u002Foption><option>Not sure yet<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;color:#425466\">Preferred contact<sc-raw-select style=\"border:1px solid #D5DCE5;border-radius:6px;padding:11px 12px;font:inherit;font-size:15px;background:#fff;color:#0B1F3A\"><option>Email<\u002Foption><option>Text message<\u002Foption><option>Phone call<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;color:#425466\">Scheduling preference<sc-raw-select style=\"border:1px solid #D5DCE5;border-radius:6px;padding:11px 12px;font:inherit;font-size:15px;background:#fff;color:#0B1F3A\"><option>Weekday daytime<\u002Foption><option>Weekday evening<\u002Foption><option>Saturday<\u002Foption><option>Flexible<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;color:#425466\">How did you hear about Apex?<sc-raw-select style=\"border:1px solid #D5DCE5;border-radius:6px;padding:11px 12px;font:inherit;font-size:15px;background:#fff;color:#0B1F3A\"><option>Search<\u002Foption><option>Friend or family<\u002Foption><option>Social media<\u002Foption><option>Clinician referral<\u002Foption><option>Other<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n    <div style=\"grid-column:1/-1;border-top:1px solid #E6EBF1;padding-top:16px;display:flex;flex-direction:column;gap:12px\">\n      <label style=\"display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#425466\"><input type=\"checkbox\" style=\"margin-top:3px;accent-color:#2E8B82\">I agree to receive text messages from Apex Wellness about availability and scheduling. Optional. Message and data rates may apply; reply STOP to end.<\u002Flabel>\n      <label style=\"display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#425466\"><input type=\"checkbox\" style=\"margin-top:3px;accent-color:#2E8B82\">I have read the <a href=\"#privacy\" style=\"text-decoration:underline;text-underline-offset:2px\">Privacy Policy<\u002Fa> and understand this form is for scheduling contact only.<\u002Flabel>\n    <\u002Fdiv>\n    <button type=\"button\" style=\"grid-column:1/-1;background:#0B1F3A;color:#fff;border:0;padding:14px;border-radius:6px;font:inherit;font-weight:500;font-size:15.5px;cursor:pointer\" style-hover=\"background:#2E8B82\">{{ ctaLabel }} →<\u002Fbutton>\n    <p style=\"margin:0;grid-column:1/-1;font-size:12.5px;color:#8792A2\">Please do not include diagnoses, medications, symptoms, or lab values here. Clinical information is collected through secure intake after scheduling.<\u002Fp>\n  <\u002Fform>\n<\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<footer style=\"border-top:1px solid #E6EBF1;background:#F6F9FC;padding:56px 120px 40px;display:flex;flex-direction:column;gap:40px;font-size:14px;color:#425466\">\n  <div style=\"display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:40px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><a href=\"#home\" style=\"display:flex;align-items:center;gap:10px;color:#0B1F3A\" style-hover=\"color:#0B1F3A\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 22 22\" fill=\"none\"><path d=\"M11 2 20 20H2L11 2Z\" stroke=\"#0B1F3A\" stroke-width=\"1.75\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M11 9.5 15.2 18H6.8L11 9.5Z\" fill=\"#2E8B82\"><\u002Fpath><\u002Fsvg><span style=\"font-weight:600;font-size:16px;letter-spacing:-.02em\">Apex Wellness<\u002Fspan><\u002Fa><span>Personalized medical wellness. A clear plan. Ongoing follow-through.<\u002Fspan><span style=\"font-weight:500;font-size:12px;color:#8792A2\">[Legal entity / DBA pending counsel]<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8792A2\">Care<\u002Fspan><a href=\"#weight\" style=\"color:#425466\">Weight and Metabolic<\u002Fa><a href=\"#men\" style=\"color:#425466\">Men's Hormone Health<\u002Fa><a href=\"#women\" style=\"color:#425466\">Women's Midlife Care<\u002Fa><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8792A2\">Clinic<\u002Fspan><a href=\"#how\" style=\"color:#425466\">How It Works<\u002Fa><a href=\"#pricing\" style=\"color:#425466\">Pricing<\u002Fa><a href=\"#about\" style=\"color:#425466\">About and Team<\u002Fa><a href=\"#faq\" style=\"color:#425466\">FAQ<\u002Fa><a href=\"#priority\" style=\"color:#425466\">Priority List<\u002Fa><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8792A2\">Policies<\u002Fspan><a href=\"#privacy\" style=\"color:#425466\">Privacy Policy<\u002Fa><a href=\"#terms\" style=\"color:#425466\">Terms of Use<\u002Fa><a href=\"#consent\" style=\"color:#425466\">Communications Consent<\u002Fa><a href=\"#access\" style=\"color:#425466\">Accessibility Statement<\u002Fa><a href=\"#refund\" style=\"color:#425466\">Cancellation and Refunds<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;color:#8792A2;border-top:1px solid #E6EBF1;padding-top:24px;max-width:980px\">\n    <span>Apex Wellness is a cash-pay medical practice and does not bill insurance. Laboratory testing, medication, and supplies are billed separately unless stated otherwise. Payment for an evaluation does not guarantee treatment or a prescription.<\u002Fspan>\n    <span>Apex Wellness does not provide urgent or emergency care. If you are experiencing a medical emergency, call 911 or go to the nearest emergency department.<\u002Fspan>\n    <span>© 2026 Apex Wellness. Phone, email, and hours will be published when clinic channels are live.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;launchState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;prelaunch&quot;,&quot;launch&quot;],&quot;default&quot;:&quot;prelaunch&quot;,&quot;tsType&quot;:&quot;'prelaunch' | 'launch'&quot;,&quot;section&quot;:&quot;Site state&quot;},&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;weight&quot;,&quot;men&quot;,&quot;women&quot;,&quot;how&quot;,&quot;pricing&quot;,&quot;about&quot;,&quot;faq&quot;,&quot;priority&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navigation&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: 'home' };\n  componentDidMount() {\n    this.onHash = () => {\n      const h = (location.hash || '#home').slice(1);\n      const known = ['home','weight','men','women','how','pricing','about','faq','priority'];\n      if (known.includes(h)) { this.setState({ page: h, navigated: true }); window.scrollTo(0, 0); }\n    };\n    window.addEventListener('hashchange', this.onHash);\n    if (location.hash) this.onHash();\n  }\n  componentDidUpdate(prev) { if (prev.page !== this.props.page && this.state.navigated) this.setState({ navigated: false }); }\n  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); }\n  renderVals() {\n    const page = this.state.navigated ? this.state.page : (this.props.page ?? this.state.page);\n    const launch = (this.props.launchState ?? 'prelaunch') === 'launch';\n    const lanes = {\n      weight: {\n        eyebrow: 'Care area 01 · Medical weight and metabolic care', imgId: 's-lane-weight', imgPlaceholder: 'Patient and clinician reviewing a simple plan', cta: 'Start Your Evaluation',\n        headline: 'Weight and metabolic care managed by a physician, not a menu.',\n        intro: 'A physician reviews your evaluation, labs, and plan, and decides with you whether medication belongs in it. For adults who want more than medication fulfillment.',\n        who: 'Adults who value appropriate screening, body-composition or functional tracking, nutrition and protein guidance, resistance-training support, careful titration, access for side effects, plateau management, and a plan for maintenance or discontinuation. This service is not for people seeking a guaranteed medication or the lowest medication price alone.',\n        evaluation: 'A clinical evaluation covering relevant history and risk review, your goals, prior attempts, and current medications. Appropriate measurements or laboratory review are discussed. You leave with a written summary of findings and options.',\n        testing: 'Depending on your history: metabolic and cardiovascular laboratory markers, body-composition or functional measurements, and review of recent outside results. Testing is ordered only when clinically indicated and is billed separately.',\n        treatIntro: 'Options are individualized. Medication is discussed only when clinically appropriate, and never as the only lever.',\n        treatments: [\n          { name: 'Nutrition and protein guidance', note: 'Practical targets built around muscle preservation.' },\n          { name: 'Resistance-training support', note: 'Lean-mass plan appropriate to your starting point.' },\n          { name: 'Prescription medication, when appropriate', note: 'Candidacy, titration, side-effect access, and monitoring.' },\n          { name: 'Maintenance and discontinuation planning', note: 'What happens after the goal, decided in advance.' }\n        ],\n        treatDisclaimer: 'Apex does not promise weight loss, guaranteed medication, or automatic eligibility, and does not offer \"generic\" versions of brand-name GLP-1 medications. Compounded and FDA-approved products are not equivalent.',\n        followup: 'Scheduled follow-up visits, measurement review, dose adjustment when indicated, plateau management, and secure messaging for side effects and questions with defined response expectations.',\n        includes: 'Physician review and management, follow-up visits, body-composition and lean-mass plan, secure messaging.', excludes: 'Medication, external laboratory testing, shipping.',\n        refer: 'When your history suggests a condition outside our approved scope, when a medication is not clinically appropriate for you, or when coordination with primary care, endocrinology, cardiology, bariatric surgery, or another specialist is the right destination. We say so directly and help with the handoff.',\n        faq: [\n          { q: 'Do I need labs before the first visit?', a: 'No. Bring recent results if you have them. Testing is ordered after the evaluation only when clinically indicated.' },\n          { q: 'Is medication included in the monthly fee?', a: 'No. Medication and external labs are billed separately and explained before you enroll.' },\n          { q: 'What if a medication is not right for me?', a: 'The plan still covers nutrition, training, and measurement, and we say plainly when another clinician is a better fit.' }\n        ]\n      },\n      men: {\n        eyebrow: 'Care area 02 · Men\\u2019s hormone health', imgId: 's-lane-men', imgPlaceholder: 'Private consultation, calm setting', cta: 'Request an Evaluation',\n        headline: 'Men\\u2019s hormone care with a physician reviewing every result.',\n        intro: 'A physician interprets your labs in the context of your symptoms and risks, then manages dosing and monitoring over time. Testosterone is not promised, and one number does not decide the plan.',\n        who: 'Men with symptoms or laboratory findings that merit evaluation, who want an explanation of what the numbers mean, what the alternatives are, and what monitoring looks like over time. Not appropriate for men seeking a guaranteed prescription or treatment without evaluation.',\n        evaluation: 'Symptom and medical-history review, including sleep, cardiovascular, blood-pressure, fertility, and other risk considerations. Time is built in to explain findings. You leave with a written summary of options, including no treatment.',\n        testing: 'Appropriate laboratory testing, which may include morning total and free testosterone, related hormones, blood counts, lipids, PSA where appropriate, and metabolic markers. Repeat testing may be needed before any decision. Testing is billed separately.',\n        treatIntro: 'Treatment alternatives are discussed on their merits. If therapy is selected and clinically appropriate, both clinic and home pathways are explained.',\n        treatments: [\n          { name: 'Lifestyle, sleep, and metabolic factors', note: 'Often part of the plan, sometimes the whole plan.' },\n          { name: 'Testosterone therapy, when indicated', note: 'Clinic-administered or home administration with teach-back.' },\n          { name: 'Alternatives to testosterone', note: 'Including options that preserve fertility, when relevant.' },\n          { name: 'Structured monitoring', note: 'Defined lab and visit cadence with safety markers.' }\n        ],\n        treatDisclaimer: 'Apex does not treat every tired man as a candidate, does not present a value below a specific threshold as inherently deficient, and does not promise improvements in mood, libido, or muscle.',\n        followup: 'Routine monitoring on a defined schedule, dose adjustments when indicated, refill coordination, secure messaging with defined response expectations, and education for home administration if that pathway is selected.',\n        includes: 'Physician review and management, defined routine monitoring, follow-up visits, secure messaging. Standard medication and supplies are included in a published bundle only after vendor confirmation.', excludes: 'Baseline and specialty laboratory testing, other therapies, shipping for home delivery where applicable.',\n        refer: 'When findings suggest a pituitary, testicular, or other condition needing specialist care, when fertility goals require a reproductive specialist, when cardiovascular or hematologic risk requires coordination, or when treatment is not clinically appropriate. We explain why and help you get to the right clinician.',\n        faq: [\n          { q: 'Will I be prescribed testosterone at the first visit?', a: 'No decision is made without appropriate testing and a full risk review. Payment does not guarantee treatment.' },\n          { q: 'Can I inject at home?', a: 'If therapy is selected and clinically appropriate, home administration is available with training and teach-back. A clinic pathway is also offered.' },\n          { q: 'Do you use an \"optimal\" testosterone number?', a: 'No. Symptoms, repeat laboratory results, risks, and goals are considered together. A single threshold does not define deficiency.' }\n        ]\n      },\n      women: {\n        eyebrow: 'Care area 03 · Women\\u2019s midlife hormone and metabolic care', imgId: 's-lane-women', imgPlaceholder: 'Clinician listening during a consultation', cta: 'Request an Evaluation',\n        headline: 'Midlife hormone and metabolic care, reviewed by a physician.',\n        intro: 'A physician reviews your history and risk factors before any option is offered, and coordinates with your primary care, OB/GYN, or other specialists when appropriate.',\n        who: 'Women with perimenopause, menopause, metabolic, weight, sleep, or related midlife concerns who want an individualized risk assessment rather than a generic \"balancing\" promise. Apex does not replace OB/GYN, primary, or emergency care.',\n        evaluation: 'Individualized history and risk assessment, including reproductive and pregnancy context where relevant; cancer, clot, cardiovascular, liver, and abnormal-bleeding considerations; sleep and metabolic concerns; and your goals. You leave with a written summary of options.',\n        testing: 'Testing is individualized and not always required to diagnose perimenopause or menopause. Metabolic, thyroid, lipid, and other markers may be considered based on history. Results from your other clinicians are reviewed when available. Testing is billed separately.',\n        treatIntro: 'Options are discussed by category with their benefits, risks, and alternatives. Hormone therapy is not appropriate for everyone.',\n        treatments: [\n          { name: 'Hormone therapy, when appropriate', note: 'Route and formulation options, with individualized risk review.' },\n          { name: 'Non-hormonal options', note: 'For symptoms when hormones are not suitable or not preferred.' },\n          { name: 'Weight and metabolic support', note: 'Nutrition, muscle preservation, and medication only when indicated.' },\n          { name: 'Sleep and cardiometabolic risk', note: 'Addressed alongside symptoms, not separately.' }\n        ],\n        treatDisclaimer: 'Apex does not promise broad \"hormone balancing,\" does not treat hormones as appropriate for everyone, and coordinates or refers when another clinician is the right destination.',\n        followup: 'Titration and monitoring on a defined schedule, follow-up visits, secure messaging with defined response expectations, and coordination with your OB/GYN or primary care clinician when appropriate.',\n        includes: 'Physician review and management, titration, monitoring, follow-up visits, secure messaging.', excludes: 'Medication, external laboratory testing, imaging, procedures.',\n        refer: 'Abnormal bleeding, findings that need gynecologic or oncologic evaluation, complex cardiovascular or clotting history, pregnancy, or conditions outside our approved scope. We coordinate directly with your other clinicians.',\n        faq: [\n          { q: 'Do I need to stop seeing my OB/GYN?', a: 'No. Apex coordinates with your OB/GYN and primary care clinician and refers when their care is the right destination.' },\n          { q: 'Is hormone therapy required?', a: 'No. Non-hormonal options and metabolic support are part of the conversation, and hormone therapy is offered only when appropriate for you.' },\n          { q: 'Are pellets offered?', a: 'No. Pellet procedures are not part of Apex care at launch.' }\n        ]\n      }\n    };\n    const lane = lanes[page] || lanes.weight;\n    return {\n      isHome: page === 'home', isCare: !!lanes[page], isHow: page === 'how', isPricing: page === 'pricing', isAbout: page === 'about', isFaq: page === 'faq', isPriority: page === 'priority',\n      lane,\n      ctaLabel: launch ? 'Schedule an Evaluation' : 'Join the Priority List',\n      statusTag: launch ? 'Now open' : 'Pre-launch',\n      announcement: launch ? 'Now scheduling evaluations in Northwest Indiana.' : 'Opening in Northwest Indiana. Join the priority list for launch updates and early appointment access.',\n      locationHeadline: launch ? '[Approved address], Northwest Indiana' : 'Opening in Northwest Indiana.',\n      locationCopy: launch ? 'Entrance, parking, accessibility, and hours are listed below once approved.' : 'Exact location and appointment availability will be announced soon.',\n      priorityHeadline: launch ? 'Schedule your evaluation.' : 'Join the priority list.',\n      priorityCopy: launch ? 'Choose a care area and a time. Complete cost and reservation terms are shown before payment.' : 'Launch updates, early appointment access, and complete reservation terms before any payment.',\n      priceRows: [\n        { name: 'Initial evaluation / reservation', cadence: 'One time', included: 'Completed clinical evaluation; credit toward enrollment per published terms.', excluded: 'External diagnostic labs.', price: '$ ———' },\n        { name: 'Medical weight management', cadence: 'Per calendar month', included: 'Physician review and management, follow-up, body-composition and lean-mass plan, messaging.', excluded: 'Medication and external labs.', price: '$ ———' },\n        { name: 'Men\\u2019s hormone care, clinic', cadence: 'Per calendar month', included: 'Defined routine monitoring, follow-up, messaging; standard medication and supplies once vendor terms are confirmed.', excluded: 'Baseline and specialty labs, other therapies.', price: '$ ———' },\n        { name: 'Men\\u2019s hormone care, home', cadence: 'Per calendar month', included: 'Clinic bundle plus delivery, handling, and teach-back.', excluded: 'Baseline and specialty labs, other therapies.', price: '$ ———' },\n        { name: 'Women\\u2019s hormone / metabolic care', cadence: 'Per calendar month', included: 'Titration, monitoring, follow-up, messaging.', excluded: 'Medication and external labs.', price: '$ ———' }\n      ],\n      pricingFaq: [\n        { q: 'Is the evaluation fee credited if I enroll?', a: 'The credit and refund rules are published with final pricing and shown before payment.' },\n        { q: 'When does monthly billing begin?', a: 'Only after you review your plan and choose to enroll. Fees are per calendar month, not every four weeks.' },\n        { q: 'Are labs included?', a: 'Routine monitoring labs are defined per care area. Baseline and specialty labs are billed separately, and recent outside labs may be used when appropriate.' },\n        { q: 'Are medications included?', a: 'Medication is separate unless a published bundle states otherwise. Bundles are published only after vendor costs are confirmed.' },\n        { q: 'Can I pause or cancel?', a: 'Pause, cancellation, rescheduling, refund, and discharge terms are provided before payment and linked in the footer.' },\n        { q: 'Does payment guarantee treatment?', a: 'No. Treatment begins only after clinical eligibility and consent.' }\n      ],\n      faqGroups: [\n        { title: 'Cost and insurance', items: [\n          { q: 'Is Apex Wellness cash-pay?', a: 'Yes. Apex is a cash-pay medical practice with published fees.' },\n          { q: 'Does Apex accept insurance?', a: 'No, not at launch. You may receive documentation for your records; reimbursement is not guaranteed.' },\n          { q: 'What does the initial evaluation cost, and is it credited?', a: 'The fee and credit rules are published on the Pricing page before booking opens.' },\n          { q: 'What might the first 90 days cost?', a: 'A representative 90-day total for each care area is published with final pricing, including evaluation, monthly fees, typical labs, and medication where applicable.' }\n        ]},\n        { title: 'Care and eligibility', items: [\n          { q: 'Does booking guarantee a prescription or treatment?', a: 'No. Treatment begins only after clinical eligibility and consent.' },\n          { q: 'How long is the first visit?', a: 'Long enough to explain findings and options; the exact length is published with scheduling.' },\n          { q: 'Who will see me?', a: 'A licensed clinician conducts your visit, and a physician reviews your evaluation, labs, and plan. Names, credentials, and roles are published on the About page after verification.' },\n          { q: 'Can I use an outside laboratory?', a: 'Recent outside results may be reviewed. Additional testing is ordered only when clinically indicated.' },\n          { q: 'What happens if treatment is not appropriate?', a: 'You still receive a written summary of findings and options, and we refer you to the right clinician when that is the better path.' },\n          { q: 'Does Apex provide urgent or emergency care?', a: 'No. If you are experiencing a medical emergency, call 911 or go to the nearest emergency department.' }\n        ]},\n        { title: 'Logistics', items: [\n          { q: 'Can medication be delivered or administered at the clinic?', a: 'Both pathways are planned where clinically appropriate. Details are published when vendor terms are confirmed.' },\n          { q: 'How often are follow-up visits and lab checks?', a: 'On a defined schedule set in your written plan and specific to your care area.' },\n          { q: 'How does Apex communicate results and questions securely?', a: 'Through a secure patient portal and messaging with defined response expectations. Clinical details are never collected through marketing forms.' },\n          { q: 'Where is Apex located, and is the office accessible?', a: 'Opening in Northwest Indiana. Address, parking, and accessibility details are published once the location is approved.' }\n        ]}\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
